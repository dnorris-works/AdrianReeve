<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Site Test</title>
    <style>
        body { font-family: monospace; max-width: 640px; margin: 40px auto; padding: 0 20px; background: #111; color: #eee; }
        h1 { font-size: 1rem; color: #aaa; margin-bottom: 24px; }
        .test { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
        .label { color: #ccc; }
        .result { font-weight: bold; }
        .pass  { color: #4caf50; }
        .fail  { color: #f44336; }
        .info  { color: #64b0f4; }
        .pending { color: #888; }
        #summary { margin-top: 24px; font-size: 1.1rem; }
    </style>
</head>
<body>
    <h1>Static Site Diagnostics</h1>
    <div id="tests"></div>
    <div id="summary" class="pending">Running…</div>

    <script>
    const results = [];

    function addTest(label) {
        const container = document.getElementById('tests');
        const row = document.createElement('div');
        row.className = 'test';
        row.innerHTML = `<span class="label">${label}</span><span class="result pending" id="r-${results.length}">…</span>`;
        container.appendChild(row);
        const index = results.length;
        results.push({ label, el: document.getElementById(`r-${index}`), passed: null });
        return index;
    }

    function setResult(index, passed, text) {
        const r = results[index];
        r.passed = passed;
        r.el.textContent = text;
        r.el.className = 'result ' + (passed === true ? 'pass' : passed === false ? 'fail' : 'info');
    }

    async function run() {

        // 1. No server-side script execution — PHP/ASP endpoints should return 404 or raw text
        const phpIdx = addTest('No PHP execution (.php returns 404 or raw text)');
        try {
            const r = await fetch('/test-probe.php', { method: 'GET' });
            if (r.status === 404) {
                setResult(phpIdx, true, '404 — not executed');
            } else {
                const text = await r.text();
                // A real PHP server would return HTML/output, not the raw source
                setResult(phpIdx, text.includes('<?php') ? true : false,
                    text.includes('<?php') ? 'Raw source served (static ✓)' : `Unexpected ${r.status}`);
            }
        } catch (e) {
            setResult(phpIdx, true, 'Fetch blocked — likely 404');
        }

        // 2. Directory listing is disabled
        const dirIdx = addTest('Directory listing disabled (/books/)');
        try {
            const r = await fetch('/books/');
            const text = await r.text();
            const looksLikeListing = /Index of|<a href="book-/i.test(text);
            setResult(dirIdx, !looksLikeListing,
                looksLikeListing ? 'Directory listing ON (dynamic server)' : `${r.status} — listing off`);
        } catch (e) {
            setResult(dirIdx, null, 'Could not determine');
        }

        // 3. Server header — static hosts typically say "nginx" or nothing at all
        const headerIdx = addTest('Server header (nginx / no backend)');
        try {
            const r = await fetch('/');
            const server = r.headers.get('server') || '(none)';
            const isStatic = /nginx|cloudflare|vercel|netlify|github|fastly/i.test(server) || server === '(none)';
            setResult(headerIdx, isStatic, server);
        } catch (e) {
            setResult(headerIdx, null, 'Could not read headers');
        }

        // 4. No powered-by header (Express/Rails/PHP would set this)
        const poweredIdx = addTest('No X-Powered-By header');
        try {
            const r = await fetch('/');
            const powered = r.headers.get('x-powered-by');
            setResult(poweredIdx, !powered, powered || 'absent ✓');
        } catch (e) {
            setResult(poweredIdx, null, 'Could not read headers');
        }

        // 5. manifest.json is served correctly (our own static file)
        const manifestIdx = addTest('books/manifest.json served as JSON');
        try {
            const r = await fetch('/books/manifest.json');
            if (!r.ok) { setResult(manifestIdx, false, `HTTP ${r.status}`); }
            else {
                const data = await r.json();
                setResult(manifestIdx, Array.isArray(data), Array.isArray(data) ? `OK — ${data.length} book(s)` : 'Unexpected format');
            }
        } catch (e) {
            setResult(manifestIdx, false, 'Failed: ' + e.message);
        }

        // 6. A non-existent API route returns 404, not a JSON error from a framework
        const apiIdx = addTest('No API framework (/api/books returns 404)');
        try {
            const r = await fetch('/api/books');
            const text = await r.text();
            const looksLikeApi = r.status === 200 || text.startsWith('{') || text.startsWith('[');
            setResult(apiIdx, !looksLikeApi, looksLikeApi ? 'API endpoint found!' : `${r.status} — no API`);
        } catch (e) {
            setResult(apiIdx, true, '404 / blocked');
        }

        // Summary
        const passed = results.filter(r => r.passed === true).length;
        const failed = results.filter(r => r.passed === false).length;
        const unknown = results.filter(r => r.passed === null).length;
        const summary = document.getElementById('summary');
        summary.textContent = `${passed} passed · ${failed} failed · ${unknown} inconclusive`;
        summary.className = failed === 0 ? 'pass' : 'fail';
    }

    run();
    </script>
</body>
</html>
